<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-image: url("bg.jpg"); /* Put your image in same folder */
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .box {
      background: rgba(255, 255, 255, 0.85);
      padding: 40px 60px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    h1 {
      color: #e63946;
      font-size: 36px;
      margin-bottom: 30px;
    }

    button {
      font-size: 18px;
      padding: 12px 30px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin: 10px;
      position: relative;
    }

    #yes {
      background-color: #e63946;
      color: white;
    }

    #no {
      background-color: #ccc;
      position: absolute;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>WILL YOU BE MY VALENTINE? 💖</h1>
    <button id="yes" onclick="yesClicked()">YES ❤️</button>
    <button id="no" onmouseover="moveNo()">NO 😜</button>
  </div>

  <script>
    function moveNo() {
      const btn = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      btn.style.left = x + "px";
      btn.style.top = y + "px";
    }

    function yesClicked() {
      document.body.innerHTML = `
        <h1 style="
          color: white;
          font-size: 50px;
          text-align: center;
          margin-top: 40vh;
          text-shadow: 2px 2px 10px black;">
          💘 YAY! YOU SAID YES 💘
        </h1>`;
    }
  </script>
</body>
</html>
